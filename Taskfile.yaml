# https://taskfile.dev

version: "3"
silent: true

tasks:
  default:
    desc: Run
    cmds:
      - go run . {{.CLI_ARGS}}
    interactive: true

  build:
    desc: Build
    cmds:
      - go build .

  uninstall:
    desc: Uninstall from the gh extensions
    cmd: |
      if gh ext list | grep --quiet 'gh dash'; then echo "🕐 Uninstalling..."; gh ext remove dash; fi
      exit 0

  install:
    desc: Install the local app as a gh extension
    cmds:
      - task: build
      - task: uninstall
      - echo "🕐 Installing local build..." && gh ext install .
      - gh dash --version

  install:prod:
    desc: Install the latest available version as a gh extension
    cmds:
      - task: uninstall
      - echo "🕐 Installing latest version..." && gh ext install dlvhdr/gh-dash
      - gh dash --version

  debug:
    desc: Run in debug mode. Run `task logs` to watch the logs.
    env:
      LOG_LEVEL: debug
      DEBUG: true
    cmds:
      - printf "~\n~\n~\n~\n~\n~\n~\n~\n~\n~\n~\n~\n~\n~\n~\n―――――――――――――――――――――――――――――――――――――――――――――――\n" > ./debug.log
      - go run . --debug {{.CLI_ARGS}}
    interactive: true

  debug:warn:
    desc: Run in debug mode, only log above warning level. Run `task logs` to watch the logs.
    env:
      LOG_LEVEL: warn
      DEBUG: true
    cmds:
      - printf "~\n~\n~\n~\n~\n~\n~\n~\n~\n~\n~\n~\n~\n~\n~\n―――――――――――――――――――――――――――――――――――――――――――――――\n" > ./debug.log
      - go run . --debug {{.CLI_ARGS}}
    interactive: true

  debug:info:
    desc: Run in debug mode, only log above info level. Run `task logs` to watch the logs.
    env:
      LOG_LEVEL: info
      DEBUG: true
    cmds:
      - printf "~\n~\n~\n~\n~\n~\n~\n~\n~\n~\n~\n~\n~\n~\n~\n―――――――――――――――――――――――――――――――――――――――――――――――\n" > ./debug.log
      - go run . --debug {{.CLI_ARGS}}
    interactive: true

  profile:
    desc: Run with profiling enabled
    env:
      DASH_PROFILE: true
      LOG_LEVEL: debug
      DEBUG: true
    cmds:
      - printf "~\n~\n~\n~\n~\n~\n~\n~\n~\n~\n~\n~\n~\n~\n~\n―――――――――――――――――――――――――――――――――――――――――――――――\n" > ./debug.log
      - go run . --debug {{.CLI_ARGS}}
    interactive: true

  profile:cpu:
    desc: 10s CPU profile
    cmds:
      - go tool pprof -http :6061 'http://localhost:6060/debug/pprof/profile?seconds=10'

  profile:heap:
    desc: Heap profile
    cmds:
      - go tool pprof -http :6061 'http://localhost:6060/debug/pprof/heap'

  profile:allocs:
    desc: Allocations profile
    cmds:
      - go tool pprof -http :6061 'http://localhost:6060/debug/pprof/allocs'

  dlv:
    desc: Debug with dlv
    cmds:
      - dlv debug --headless --api-version=2 --listen=127.0.0.1:43000 .

  logs:
    desc: Tail the debug logs
    cmds:
      - rm -f ./debug.log
      - touch ./debug.log
      - tail -f ./debug.log
    interactive: true

  lint:
    desc: Run base linters
    cmds:
      - golangci-lint run --path-mode=abs --config=".golangci.yml" --timeout=5m
    env:
      GOEXPERIMENT: null

  lint:fix:
    desc: Run base linters and fix issues
    cmds:
      - golangci-lint run --path-mode=abs --config=".golangci.yml" --timeout=5m --fix
    env:
      GOEXPERIMENT: null

  test:one:
    desc: Run a test
    cmds:
      - gotip

  test:rerun:
    cmds:
      - gotip --rerun
    desc: Rerun the last test

  test:
    desc: Run tests
    cmds:
      - prism test {{.CLI_ARGS}} ./...

  notify:
    desc: "Run the PR notifier in the foreground (task notify -- --interval 2m)"
    cmds:
      - task: install
      - gh dash notify {{.CLI_ARGS}}

  notify:install:
    desc: "Install the PR notifier as a launchd background agent. Customize with: task notify:install INTERVAL=2m"
    vars:
      INTERVAL: '{{.INTERVAL | default "5m"}}'
      PLIST: "$HOME/Library/LaunchAgents/dev.gh-dash.notify.plist"
    cmds:
      - task: install
      - |
        GH="$(which gh)"
        mkdir -p "$HOME/Library/LaunchAgents"
        cat > "{{.PLIST}}" <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>Label</key>
          <string>dev.gh-dash.notify</string>
          <key>ProgramArguments</key>
          <array>
            <string>${GH}</string>
            <string>dash</string>
            <string>notify</string>
            <string>--interval</string>
            <string>{{.INTERVAL}}</string>
          </array>
          <key>RunAtLoad</key>
          <true/>
          <key>KeepAlive</key>
          <true/>
          <key>StandardOutPath</key>
          <string>/tmp/gh-dash-notify.log</string>
          <key>StandardErrorPath</key>
          <string>/tmp/gh-dash-notify.log</string>
        </dict>
        </plist>
        EOF
        launchctl load "{{.PLIST}}"
        echo "✅ gh-dash notify agent installed (interval: {{.INTERVAL}})"
        echo "   Logs: tail -f /tmp/gh-dash-notify.log"

  notify:uninstall:
    desc: "Stop and remove the PR notifier launchd agent"
    vars:
      PLIST: "$HOME/Library/LaunchAgents/dev.gh-dash.notify.plist"
    cmds:
      - launchctl unload "{{.PLIST}}" 2>/dev/null || true
      - rm -f "{{.PLIST}}"
      - rm -f "$HOME/Library/Caches/gh-dash/notify-state.json"
      - echo "✅ gh-dash notify agent removed"

  fmt:
    desc: Run gofumpt
    cmds:
      - gofumpt -w $(git ls-files '*.go')

  docs:
    desc: Start the docs dev server (Astro Starlight, pnpm 10.14.0)
    dir: docs
    cmds:
      - pnpm run dev
    interactive: true

  docs-build:
    desc: Build the docs site (Astro Starlight)
    dir: docs
    cmds:
      - pnpm run build

  check-nerd-font:
    desc: Find broken nerdfont characters
    cmds:
      - nerdfix check $(fd --extension go)

  fix-nerd-font:
    desc: Fix broken nerdfont icons
    cmds:
      - nerdfix fix --format=json $(fd --extension go)

  docs-preview:
    desc: Preview the docs production build (Astro Starlight)
    dir: docs
    cmds:
      - task: docs-build
      - pnpm run preview
